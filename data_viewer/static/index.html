<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Data Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='4' fill='%232a78d6'/%3E%3Cpath d='M3 12h26M12 12v15' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/trajectory.css">
  <script>
    try { const t = localStorage.getItem('dv-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn only-narrow" id="toggle-sidebar" title="文件" aria-label="显示文件列表">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <a class="brand" href="#" id="brand">
        <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="4" fill="var(--accent)"/><path d="M3 12h26M12 12v15" stroke="var(--surface)" stroke-width="2"/></svg>
        <span>Data Viewer</span>
      </a>
      <nav class="crumbs" id="crumbs" aria-label="路径"></nav>
      <div class="top-actions">
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar" id="sidebar" aria-label="文件">
        <div class="side-head">
          <input class="input" id="fs-filter" type="search" placeholder="筛选当前目录" autocomplete="off" spellcheck="false">
        </div>
        <div class="dir-banner" id="dir-banner" hidden></div>
        <div class="fs-list" id="fs-list" role="listbox" aria-label="目录内容"></div>
        <div class="side-foot" id="side-foot"></div>
      </aside>
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" title="拖动调整宽度"></div>

      <main class="content" id="content">
        <section class="welcome" id="welcome">
          <div class="welcome-inner">
            <h1>打开一个数据集</h1>
            <p>在左侧选择文件或目录。支持的格式：</p>
            <ul class="format-list" id="format-list"></ul>
            <p class="muted">数据只读打开；查询和统计在本机用 DuckDB 计算。</p>
          </div>
        </section>

        <section class="preview" id="preview" hidden></section>

        <section class="source" id="source" hidden>
          <div class="source-head">
            <div class="title-row">
              <span class="badge" id="src-format"></span>
              <h1 class="src-name" id="src-name"></h1>
              <div class="src-switch" id="src-switch"></div>
            </div>
            <div class="meta-row" id="src-meta"></div>
            <div class="warnings" id="src-warnings"></div>
          </div>
          <nav class="tabs" role="tablist" id="tabs">
            <button role="tab" data-tab="data" aria-selected="true">数据</button>
            <button role="tab" data-tab="trajectory" hidden>轨迹</button>
            <button role="tab" data-tab="schema">结构</button>
            <button role="tab" data-tab="stats">统计</button>
            <button role="tab" data-tab="sql">SQL</button>
            <button role="tab" data-tab="info">信息</button>
          </nav>
          <div class="panel" id="panel-data" role="tabpanel"></div>
          <div class="panel trajectory-view" id="panel-trajectory" role="tabpanel" hidden></div>
          <div class="panel" id="panel-schema" role="tabpanel" hidden></div>
          <div class="panel" id="panel-stats" role="tabpanel" hidden></div>
          <div class="panel" id="panel-sql" role="tabpanel" hidden></div>
          <div class="panel" id="panel-info" role="tabpanel" hidden></div>
        </section>
      </main>

      <aside class="drawer" id="drawer" hidden aria-label="行详情"></aside>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
